<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes neon-glow {
        0%, 100% {
          filter: drop-shadow(0 0 8px rgba(0, 255, 221, 0.8)) drop-shadow(0 0 16px rgba(37, 99, 235, 0.6));
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(0, 255, 221, 1)) drop-shadow(0 0 20px rgba(37, 99, 235, 0.8));
        }
      }
      .neon-text {
        animation: neon-glow 2s ease-in-out infinite;
      }
    </style>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00bfff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- S -->
  <g class="neon-text">
    <path d="M 40 50 L 70 50 Q 80 50 80 60 Q 80 70 70 70 L 40 70 L 40 80 L 75 80 Q 90 80 90 65 Q 90 50 75 50 Z" 
          fill="none" stroke="url(#neonGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40 90 L 75 90 Q 90 90 90 105 Q 90 120 75 120 L 40 120 Q 30 120 30 130 L 95 130" 
          fill="none" stroke="url(#neonGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- G -->
  <g class="neon-text">
    <path d="M 120 50 L 155 50 Q 170 50 170 65 L 170 115 Q 170 130 155 130 L 120 130 Q 105 130 105 115 L 105 65 Q 105 50 120 50 Z" 
          fill="none" stroke="url(#neonGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="145" y1="90" x2="170" y2="90" stroke="url(#neonGradient)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>